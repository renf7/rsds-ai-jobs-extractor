server:
  port: ${SERVER_PORT:8080}

raje:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mailboxes:
    enabled: ${MAILBOXES_ENABLED:false}
    poll-interval: ${MAILBOX_POLL_INTERVAL:PT1M}
    accounts: []

spring:
  application:
    name: rsds-ai-jobs-extractor
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:configure-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:configure-google-client-secret}
            scope: openid, profile, email
            redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}
          microsoft:
            provider: microsoft
            client-id: ${MICROSOFT_CLIENT_ID:configure-microsoft-client-id}
            client-secret: ${MICROSOFT_CLIENT_SECRET:configure-microsoft-client-secret}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}
          facebook:
            provider: facebook
            client-id: ${FACEBOOK_CLIENT_ID:configure-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:configure-facebook-client-secret}
            scope: public_profile, email
            redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}
          apple:
            provider: apple
            client-id: ${APPLE_CLIENT_ID:configure-apple-service-id}
            client-secret: ${APPLE_CLIENT_SECRET:configure-apple-client-secret}
            scope: name, email
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/discovery/v2.0/keys
          facebook:
            authorization-uri: https://www.facebook.com/v23.0/dialog/oauth
            token-uri: https://graph.facebook.com/v23.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
            user-name-attribute: id
          apple:
            issuer-uri: https://appleid.apple.com

management:
  endpoints:
    web:
      exposure:
        include: health,info
